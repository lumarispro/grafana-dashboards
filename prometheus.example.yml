# Minimal Prometheus config that feeds both dashboards and loads the alert rules.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["eu-node-01:9100", "eu-node-02:9100"]

  - job_name: lava-provider
    scrape_interval: 60s
    static_configs:
      - targets: ["127.0.0.1:9796"]
