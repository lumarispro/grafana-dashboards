groups:
  - name: hosts
    rules:
      - alert: HostDown
        expr: up{job=~"node.*"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is not answering scrapes"

      - alert: HostDiskFillingUp
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.15)
          and predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} will be full within 24h"

      - alert: HostDiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has less than 5% free"

      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} has less than 8% memory available"

      - alert: HostCpuSaturated
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} CPU above 90% for 30 minutes"

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} clock is off by more than 50 ms"

      - alert: HostSystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.instance }}"

      - alert: HostRebooted
        expr: time() - node_boot_time_seconds < 600
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.instance }} rebooted less than 10 minutes ago"
